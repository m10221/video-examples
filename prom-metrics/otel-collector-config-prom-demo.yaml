receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: demo-app
          metrics_path: /metrics
          scrape_interval: 5s
          static_configs:
            - targets: ['demo-app:8000']

processors:
  resource:
    attributes:
      - action: upsert
        key: service.name
        value: prom-flask
      - action: upsert
        key: service.namespace
        value: prom-demo
      - action: upsert
        key: deployment.environment
        value: moss-demo-environment
  batch:
    timeout: 1s

exporters:
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [signalfx]
  telemetry:
    logs:
      level: info
