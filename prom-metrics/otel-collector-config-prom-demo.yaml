receivers:
  prometheus/flask:
    config:
      scrape_configs:
        - job_name: demo-app
          metrics_path: /metrics
          scrape_interval: 5s
          static_configs:
            - targets: ['demo-app:5000']
  prometheus/node:
    config:
      scrape_configs:
        - job_name: node-exporter
          scrape_interval: 10s
          static_configs:
            - targets: ['node-exporter:9100']

processors:
  resource/flask:
    attributes:
      - action: upsert
        key: service.name
        value: prom-flask
      - action: upsert
        key: service.namespace
        value: prom-demo
      - action: upsert
        key: deployment.environment
        value: moss-demo-environment
  resource/node:
    attributes:
      - action: upsert
        key: service.name
        value: node-exporter
      - action: upsert
        key: service.namespace
        value: prom-demo
      - action: upsert
        key: deployment.environment
        value: moss-demo-environment
  batch:
    timeout: 1s

exporters:
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}
  debug:
    verbosity: normal

service:
  pipelines:
    metrics/flask:
      receivers: [prometheus/flask]
      processors: [resource/flask, batch]
      exporters: [signalfx, debug]
    metrics/node:
      receivers: [prometheus/node]
      processors: [resource/node, batch]
      exporters: [signalfx, debug]
  telemetry:
    logs:
      level: debug
